<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简历｜简洁专业版</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #5d687a;
      --blue: #2458a6;
      --blue-soft: #edf4ff;
      --line: #d8e0ec;
      --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    html { background: #e8edf3; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      font-size: 10.5pt;
      line-height: 1.55;
    }
    .editor-toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      background: #172033;
      color: white;
    }
    .editor-toolbar button {
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 6px;
      padding: 6px 12px;
      color: white;
      background: transparent;
      cursor: pointer;
    }
    .resume {
      width: 210mm;
      min-height: 297mm;
      margin: 18px auto;
      padding: 14mm 15mm 15mm;
      background: var(--paper);
      box-shadow: 0 8px 30px rgba(23,32,51,.12);
      outline: none;
    }
    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--blue);
    }
    h1 { margin: 0; font-size: 23pt; line-height: 1.1; letter-spacing: .04em; }
    .target { margin-top: 5px; color: var(--blue); font-weight: 700; font-size: 11pt; }
    .contact { max-width: 82mm; color: var(--muted); text-align: right; overflow-wrap: anywhere; }
    section { margin-top: 13px; }
    h2 {
      margin: 0 0 7px;
      padding-bottom: 4px;
      color: var(--blue);
      border-bottom: 1px solid var(--line);
      font-size: 13.5pt;
      line-height: 1.3;
      break-after: avoid;
      page-break-after: avoid;
    }
    .summary {
      padding: 9px 11px;
      border-left: 3px solid var(--blue);
      background: var(--blue-soft);
    }
    article { margin: 9px 0 11px; break-inside: avoid; page-break-inside: avoid; }
    .entry-head { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
    .entry-meta { color: var(--muted); white-space: nowrap; font-weight: 400; }
    .context { margin: 3px 0 4px; color: var(--muted); }
    ul { margin: 4px 0 0; padding-left: 1.3em; }
    li { margin: 3px 0; padding-left: .15em; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .tag { padding: 2px 7px; border: 1px solid #c7d5e8; border-radius: 999px; color: #304864; }
    a { color: var(--blue); text-decoration-thickness: 1px; overflow-wrap: anywhere; }
    [contenteditable="true"]:focus { outline: 2px dashed #8bb2e8; outline-offset: 3px; }
    @page { size: A4; margin: 12mm 14mm 14mm; }
    @media print {
      html, body { background: white; }
      body { font-size: 10.5pt; }
      .editor-toolbar { display: none !important; }
      .resume {
        width: auto;
        min-height: auto;
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <div class="editor-toolbar" aria-label="编辑工具栏">
    <button type="button" onclick="window.print()">打印 / 导出 PDF</button>
    <button type="button" onclick="clearSavedDraft()">清除本地草稿</button>
  </div>
  <main id="resume" class="resume" contenteditable="true" spellcheck="false">
    <header>
      <div data-resume-field="candidate_identity">
        <h1>候选人姓名</h1>
        <div class="target" data-resume-field="target_role_language">目标岗位｜核心定位</div>
      </div>
      <div class="contact" data-resume-field="contact">所在城市｜电话｜邮箱｜个人主页</div>
    </header>

    <section>
      <h2>职业概要</h2>
      <div class="summary" data-resume-field="recruiter_readable_claim">用两到三句话说明目标岗位、最强经历、可观察能力和最有说服力的证据。</div>
    </section>

    <section>
      <h2>工作经历</h2>
      <article>
        <div class="entry-head"><span data-resume-field="candidate_action">公司｜岗位</span><span class="entry-meta">时间范围</span></div>
        <div class="context" data-resume-field="project_context">业务或平台背景，用于帮助招聘方理解问题规模。</div>
        <ul>
          <li data-resume-field="recruiter_readable_claim">围绕具体问题说明个人动作、机制、价值和可核验结果。</li>
          <li data-resume-field="observable_behavior">用可观察行为说明如何拆解流程、定义规则或完成验收。</li>
        </ul>
      </article>
    </section>

    <section>
      <h2>项目经历</h2>
      <article>
        <div class="entry-head"><span data-resume-field="project_context">独立项目名称</span><span class="entry-meta">时间范围</span></div>
        <ul>
          <li data-resume-field="candidate_action">候选人负责的关键动作与明确范围。</li>
          <li data-resume-field="value">解决的用户、业务、产品或系统问题。</li>
          <li data-resume-field="evidence">交付物、规模、测试、Eval、使用反馈或其他真实证据。</li>
        </ul>
      </article>
    </section>

    <section>
      <h2>教育与技能</h2>
      <div data-resume-field="education"><strong>学校｜学历｜专业</strong>　时间范围</div>
      <div class="tags" data-resume-field="skills"><span class="tag">能力或工具</span><span class="tag">能力或工具</span></div>
      <div data-resume-field="links"></div>
    </section>
  </main>
  <script>
    const resume = document.getElementById('resume');
    const storageKey = `jianli-clean-${location.pathname}`;
    const saved = localStorage.getItem(storageKey);
    if (saved) resume.innerHTML = saved;
    resume.addEventListener('input', () => localStorage.setItem(storageKey, resume.innerHTML));
    function clearSavedDraft() {
      localStorage.removeItem(storageKey);
      location.reload();
    }
  </script>
</body>
</html>
